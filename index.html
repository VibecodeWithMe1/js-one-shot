<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; transition: 0.3s; }
        body.dark { background: #222; color: #eee; }
        .box { padding: 10px; border: 1px solid gray; margin: 10px 0; }
        .box.active { background: lightgreen; }
        #hoverBox { width: 200px; height: 80px; background: lightgray; color: #000; padding: 10px; }
        section { margin-bottom: 25px; }
    </style>
</head>
<body>

    <h1 id="heading">Heading</h1>
    <p class="para">This is a paragraph.</p>
    <a id="myLink" href="https://example.com">My Link</a>

    <section>
        <h3>List</h3>
        <ul id="list">
            <li>JavaScript</li>
            <li>React</li>
        </ul>
    </section>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <section>
        <h3>Events</h3>
        <button id="changeBtn">Change heading</button>
        <button id="themeBtn">Toggle dark mode</button>
        <button id="colorBtn">Log click event</button>
    </section>

    <section>
        <form id="myForm">
            <input type="text" id="nameInput" placeholder="Type your name">
            <button type="submit">Submit</button>
        </form>
        <p id="output"></p>
    </section>

    <section>
        <div id="hoverBox">Hover over me</div>
    </section>

    <section>
        <h3>Counter: <span id="counter">0</span></h3>
        <button id="countBtn">Increase</button>
    </section>

    <section>
        <input type="number" id="evenOddInput" placeholder="Enter a number">
        <button id="evenOddBtn">Check</button>
        <p id="evenOddResult"></p>
    </section>

    <!-- script at the end so all elements exist before JS runs -->
    <script src="script.js"></script>
</body>
</html>
